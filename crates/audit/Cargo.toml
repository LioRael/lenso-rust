[package]
name = "lenso-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scoped append-only audit services with explicit authority and repository boundaries"

[features]
default = ["plugin"]
plugin = ["dep:lenso-plugin-core"]
sqlite = ["dep:rusqlite", "dep:serde", "dep:serde_json", "dep:tokio"]

[lints]
workspace = true

[dependencies]
lenso-plugin-core = { workspace = true, optional = true }

rusqlite = { version = "=0.38.0", features = ["bundled"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true

[[example]]
name = "audit-plugin"
required-features = ["plugin"]

[[example]]
name = "permission-change"
required-features = ["sqlite"]
