[package]
name = "lenso-plugin-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Typed native plugin composition and explicit asynchronous lifecycle"

[dependencies]
tokio = { version = "1", features = ["rt", "sync"] }
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
