[package]
name = "lenso-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Borrowed native MCP tool adapter with bounded discovery and draining cancellation"

[features]
default = ["stdio"]
stdio = ["dep:rmcp"]

[[bin]]
name = "lenso-mcp-demo"
path = "src/bin/demo.rs"
required-features = ["stdio"]

[lints]
workspace = true

[dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"], optional = true }
lenso-plugin-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
base64 = "0.22"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
lenso-authorization = { path = "../authorization", default-features = false }
rmcp = { version = "=3.5.0", default-features = false, features = ["client"] }
tokio = { workspace = true, features = ["test-util", "process"] }
