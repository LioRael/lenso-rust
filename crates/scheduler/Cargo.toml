[package]
name = "lenso-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Durable cron scheduling with IANA timezones and a SQLite task outbox"

[dependencies]
lenso-plugin-core.workspace = true
lenso-tasks = { path = "../tasks" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "=0.38.0", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
croner = "=4.0.1"

[dev-dependencies]
tempfile = "3"
postgres = "0.19"

[features]
postgres-tests = ["lenso-tasks/postgres"]
